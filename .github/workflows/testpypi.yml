name: Publish to TestPyPI

# Publishes via PyPA Trusted Publishing (OIDC) — no API token or stored secret.
# A one-time "pending publisher" must be registered on TestPyPI for the
# emergenv project, pointing at this repo and this workflow file (testpypi.yml)
# and the `testpypi` environment below. See:
# https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "test-v*"       # e.g. push tag test-v1.0.0 to trigger a TestPyPI release
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  publish:
    name: Build and publish to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
