name: Publish to PyPI

# Publishes via PyPA Trusted Publishing (OIDC) — no API token or stored secret.
# A one-time "pending publisher" must be registered on PyPI for the emergenv
# project, pointing at this repo and this workflow file (pypi.yml) and the
# `pypi` environment below. This is configured SEPARATELY from TestPyPI.
# See: https://docs.pypi.org/trusted-publishers/

on:
  push:
    tags:
      - "v*"            # e.g. push tag v1.0.0 to trigger a PyPI release
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No repository-url: defaults to https://upload.pypi.org/legacy/
